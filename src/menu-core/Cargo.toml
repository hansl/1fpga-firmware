[package]
name = "menu-core"
version = "0.1.0"
edition = "2024"
authors = ["Hans Larsen <hans.larsen@gmail.com>"]
description = "Host-side driver for the 1FPGA menu-core FPGA bitstream (2D GPU for the main menu)"
license = "Apache-2.0"
repository = "https://github.com/1fpga/firmware.git"

[lints]
workspace = true

[dependencies]
clap = { version = "4.3.5", features = ["derive"] }
clap-verbosity-flag = "2.0.1"
core_affinity = "0.8.1"
cyclone-v = { workspace = true }
fontdue = "0.9"
menu-core-host = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
pretty_assertions = "1.4"

# These features are no-ops for the menu-core crate but accepted to
# satisfy the workspace Docker entrypoint, which always passes
# `--no-default-features --features=platform_de10`.
[features]
default = []
platform_de10 = []
platform_desktop = []
