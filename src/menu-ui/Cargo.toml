[package]
name = "menu-ui"
version = "0.1.0"
edition = "2024"
authors = ["Hans Larsen <hans.larsen@gmail.com>"]
description = "React-on-Boa UI framework over the menu-core FPGA core"
license = "Apache-2.0"
repository = "https://github.com/1fpga/firmware.git"

[lib]
path = "src/lib.rs"

[[bin]]
name = "menu_ui"
path = "src/bin/menu_ui.rs"

[lints]
workspace = true

[dependencies]
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "b6e0fb4d8c142db7dc8f3be03a12109f3f4af298", features = ["either"] }
boa_gc = { git = "https://github.com/boa-dev/boa.git", rev = "b6e0fb4d8c142db7dc8f3be03a12109f3f4af298" }
boa_macros = { git = "https://github.com/boa-dev/boa.git", rev = "b6e0fb4d8c142db7dc8f3be03a12109f3f4af298" }
boa_runtime = { git = "https://github.com/boa-dev/boa.git", rev = "b6e0fb4d8c142db7dc8f3be03a12109f3f4af298", features = ["all"] }
clap = { version = "4.3.5", features = ["derive"] }
clap-verbosity-flag = "2.0.1"
core_affinity = "0.8.1"
ctrlc = "3.4"
evdev = "0.13"
fontdue = "0.9"
futures-lite = "2"
menu-core-host = { workspace = true }
png = "0.17"
taffy = { version = "0.10", default-features = false, features = ["std", "flexbox", "block_layout", "taffy_tree"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# These features are no-ops; satisfy the workspace Docker entrypoint
# which always passes `--no-default-features --features=platform_de10`.
default = []
platform_de10 = []
platform_desktop = []
